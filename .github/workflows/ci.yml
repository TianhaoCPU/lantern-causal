name: offline-reference-checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: lantern demo --config configs/experiments/proxy.json --output outputs/proxy.json
      - run: lantern demo --config configs/experiments/bridge.json --output outputs/bridge.json
      - run: lantern demo --config configs/experiments/bridge_unchanged.json --output outputs/bridge_unchanged.json
      - run: lantern pilot --config configs/experiments/missingness_pilot.json --output outputs/missingness_pilot.json > /dev/null
      - run: lantern blind-tasks --output outputs/blind_tasks.json --response-template outputs/blind_responses.json > /dev/null
      - run: lantern blind-eval --config configs/experiments/missingness_pilot.json --output outputs/blind_eval.json > /dev/null
